name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            (cd src && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o ../dist/swarm .)
            (cd dist && zip -q "swarm-$GITHUB_REF_NAME-$os-$arch.zip" swarm && rm swarm)
          done
          (cd dist && sha256sum *.zip > checksums.txt)

      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" > notes.md
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          else
            git log --no-merges --format='- %s' "$GITHUB_REF_NAME" > notes.md
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file notes.md
