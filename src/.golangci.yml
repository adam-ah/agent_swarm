version: "2"

run:
  tests: true

linters:
  default: all
  disable:
    - err113
    - exhaustruct
    - forbidigo
    - goconst
    - gochecknoglobals
    - gochecknoinits
    - mnd
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 20
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/yuin/goldmark
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 30
    gosec:
      excludes:
        - G204
        - G301
        - G304
        - G306
        - G703
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 200
    misspell:
      locale: US
    nestif:
      min-complexity: 8
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - lll
      - linters:
          - noctx
        text: os/exec.Command must not be called
      - linters:
          - revive
        text: should have a package comment|should have comment or be unexported
      - path: main\.go
        linters:
          - gosec
        text: G704
      - path: server\.go
        linters:
          - gosec
        text: G705
      - path: server_runs\.go
        linters:
          - gosec
        text: G705
      - path: worker\.go
        linters:
          - gosec
        text: G702

formatters:
  enable:
    - gofmt
    - goimports
